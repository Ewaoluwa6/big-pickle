<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Sales Dashboard</h1>
    <div class="actions">
      <button id="exportBtn" class="btn ghost">Export CSV</button>
      <button id="clearBtn" class="btn danger">Clear all</button>
    </div>
  </header>

  <main>
    <section class="cards" aria-label="Summary totals">
      <div class="card">
        <span class="card-label">Total sales</span>
        <span id="statCount" class="card-value">0</span>
      </div>
      <div class="card">
        <span class="card-label">Total revenue</span>
        <span id="statRevenue" class="card-value">$0.00</span>
      </div>
      <div class="card">
        <span class="card-label">Average sale</span>
        <span id="statAvg" class="card-value">$0.00</span>
      </div>
      <div class="card">
        <span class="card-label">Today</span>
        <span id="statToday" class="card-value">$0.00</span>
      </div>
    </section>

    <section class="grid">
      <div class="panel">
        <h2>Add a sale</h2>
        <form id="saleForm" class="form">
          <label>
            Product / description
            <input id="product" type="text" placeholder="e.g. Coffee beans" required />
          </label>
          <label>
            Amount
            <input id="amount" type="number" min="0" step="0.01" placeholder="0.00" required />
          </label>
          <label>
            Quantity
            <input id="qty" type="number" min="1" step="1" value="1" required />
          </label>
          <label>
            Date
            <input id="date" type="date" required />
          </label>
          <button type="submit" class="btn primary">Add sale</button>
        </form>
      </div>

      <div class="panel">
        <h2>Revenue (last 7 days)</h2>
        <canvas id="chart" width="640" height="260" aria-label="Revenue chart"></canvas>
      </div>
    </section>

    <section class="panel">
      <h2>Sales</h2>
      <div class="table-tools">
        <input id="search" type="search" placeholder="Search product..." />
        <select id="sort">
          <option value="date-desc">Newest first</option>
          <option value="date-asc">Oldest first</option>
          <option value="amount-desc">Highest amount</option>
          <option value="amount-asc">Lowest amount</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Product</th>
              <th class="num">Qty</th>
              <th class="num">Amount</th>
              <th class="num">Total</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="salesBody"></tbody>
        </table>
        <p id="emptyState" class="empty">No sales yet. Add your first sale on the left.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
